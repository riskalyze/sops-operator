# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Repo-specific review settings. The org baseline (profile, auto-review ignore
# list, learnings, knowledge base) lives in the CodeRabbit dashboard and is
# inherited. Conventions belong in AGENTS.md, not here: these instructions only
# say what to check and where a fix belongs.
inheritance: true
reviews:
  path_filters:
    # Generated by controller-gen: the file header says "Code generated by
    # controller-gen. DO NOT EDIT." and api/v1alpha1/groupversion_info.go sets
    # +kubebuilder:object:generate=true. Fix the types in
    # api/v1alpha1/sopssecret_types.go, not this file.
    - "!api/v1alpha1/zz_generated.deepcopy.go"
    # CRD written by `controller-gen crd ... output:crd:artifacts:config=config/crd`
    # (magefile.go) and annotated controller-gen.kubebuilder.io/version. Fix the
    # kubebuilder markers on the types, not this file.
    - "!config/crd/craftypath.github.io_*.yaml"
